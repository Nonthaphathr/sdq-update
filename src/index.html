<title>ระบบประเมิน SDQ และ EQ โรงเรียนกระดุมทองวิทยา</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet"/>
<script defer src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
:root{
  --p:#12A58C; --p2:#0B7F6D; --p3:#066356; --soft:#E8F8F4; --soft2:#F3FBF9; --line:#DCEBE7;
  --ink:#12332E; --muted:#5B7A74; --bg:#FFFFFF; --card:#FFFFFF;
  --ok:#15803D; --okbg:#DCFCE7; --warn:#B45309; --warnbg:#FEF3C7; --bad:#B91C1C; --badbg:#FEE2E2; --str:#0B7F6D; --strbg:#CCFBF1;
  --sh:0 1px 2px rgba(18,51,46,.05),0 8px 24px -12px rgba(18,51,46,.12);
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Sarabun','Prompt',sans-serif;font-size:16px;color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-family:'Prompt','Sarabun',sans-serif;font-weight:600}
a{color:var(--p2)}
button,input,select,textarea{font:inherit;color:inherit}
.muted{color:var(--muted)} .sp{flex:1} .tc{text-align:center} .nowrap{white-space:nowrap}
/* ---------- Layout ---------- */
.app{display:flex;min-height:100vh}
.side{position:sticky;top:0;height:100vh;width:260px;flex:0 0 260px;border-right:1px solid var(--line);background:linear-gradient(180deg,#fff,var(--soft2));display:flex;flex-direction:column;padding:16px 12px;overflow:hidden;transition:width .3s cubic-bezier(.2,.8,.2,1),flex-basis .3s cubic-bezier(.2,.8,.2,1)}
.side.mini{width:72px;flex-basis:72px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 4px 14px;border-bottom:1px solid var(--line)}
.logo{width:42px;height:42px;flex:0 0 42px;border-radius:12px;display:grid;place-items:center;background:var(--soft);overflow:hidden;color:var(--p2);font-weight:700}
.logo img{width:100%;height:100%;object-fit:contain}
.brand .t{line-height:1.2;white-space:nowrap;overflow:hidden}.brand .t b{display:block;font-size:14px;font-family:'Prompt'}.brand .t small{color:var(--muted);font-size:11.5px}
.tog{margin-left:auto;border:1px solid var(--line);background:#fff;width:28px;height:28px;border-radius:9px;cursor:pointer;flex:0 0 28px}
.side.mini .t,.side.mini .navlbl,.side.mini .sidecred,.side.mini .whoami{display:none}.side.mini .brand{flex-direction:column}.side.mini .tog{margin:6px 0 0}
.navgrp{font-size:11.5px;font-weight:600;letter-spacing:.03em;color:var(--muted);padding:12px 12px 3px;white-space:nowrap}
.navgrp:first-child{padding-top:2px}
.side.mini .navgrp{font-size:0;height:1px;background:var(--line);margin:8px 10px;padding:0}.side.mini .navgrp:first-child{display:none}
.sclose{display:none;margin-left:auto;border:1px solid var(--line);background:#fff;width:34px;height:34px;border-radius:10px;cursor:pointer;flex:0 0 34px;font-size:16px;line-height:1;place-items:center;color:var(--ink)}
.sback{display:none}
body.noscroll{overflow:hidden}
nav{flex:1;overflow-y:auto;padding:12px 0;scrollbar-width:thin}
.nav{display:flex;align-items:center;gap:11px;padding:10px 12px;margin:2px 0;border-radius:11px;cursor:pointer;color:var(--ink);transition:background .15s,transform .15s;white-space:nowrap;user-select:none}
.nav:hover{background:var(--soft)}.nav:active{transform:scale(.98)}
.nav.on{background:var(--p);color:#fff;box-shadow:0 6px 16px -8px var(--p2)}
.nav .ic{width:22px;text-align:center;font-size:17px;flex:0 0 22px}
.nav .navlbl{white-space:normal;line-height:1.25}
.whoami{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:13.5px;line-height:1.35;margin-bottom:8px}
.sidecred{font-size:11px;color:var(--muted);line-height:1.45;padding:8px 4px 0;border-top:1px solid var(--line)}
.sidecred .cr1{white-space:nowrap;color:var(--ink);font-weight:600;margin-top:4px}.sidecred .cr2{white-space:nowrap;font-size:10px;letter-spacing:-.1px}.sidecred .cr0{font-size:10.5px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:14px 26px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);z-index:20;flex-wrap:wrap}
.top h2{font-size:20px}
.top .menu{display:none}
.content{padding:22px 26px 40px;max-width:1280px;width:100%}
.foot{margin-top:auto;padding:16px 26px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);text-align:center;line-height:1.7}
/* ---------- Components ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.card h3{font-size:16.5px;margin-bottom:10px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;cursor:pointer;transition:transform .12s,background .15s,box-shadow .15s;white-space:nowrap}
.btn:hover{background:var(--soft)}.btn:active{transform:scale(.97)}
.btn.pri{background:var(--p);border-color:var(--p);color:#fff}.btn.pri:hover{background:var(--p2)}
.btn.bad{color:var(--bad);border-color:#FECACA}.btn.sm{padding:5px 10px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
label.f{display:flex;flex-direction:column;gap:5px;font-size:14px;color:var(--muted)}
label.f>input,label.f>select,label.f>textarea,.inp{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;color:var(--ink);font-size:15.5px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(18,165,140,.35);border-color:var(--p)}
textarea{resize:vertical;min-height:70px}
table.t{width:100%;border-collapse:collapse;font-size:14.5px}
table.t th{background:var(--soft);text-align:left;padding:9px 10px;font-weight:600;border-bottom:1px solid var(--line);position:sticky;top:0;white-space:nowrap}
table.t td{padding:8px 10px;border-bottom:1px solid #EEF5F3;vertical-align:middle}
table.t tr:hover td{background:var(--soft2)}
.tw{overflow:auto;border:1px solid var(--line);border-radius:12px;max-height:68vh}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;white-space:nowrap;border:1px solid transparent}
.chip.n{background:var(--okbg);color:var(--ok)}.chip.r{background:var(--warnbg);color:var(--warn)}.chip.p{background:var(--badbg);color:var(--bad)}
.chip.s{background:var(--strbg);color:var(--str)}.chip.x{background:#F1F5F4;color:var(--muted)}
.stat{display:flex;flex-direction:column;gap:2px}.stat b{font-size:28px;font-family:'Prompt';color:var(--p3);line-height:1.1}.stat span{color:var(--muted);font-size:14px}
.bar{height:10px;border-radius:99px;background:#EEF5F3;overflow:hidden;display:flex}
.bar i{display:block;height:100%}.bar .n{background:#34D399}.bar .r{background:#FBBF24}.bar .p{background:#F87171}.bar .x{background:#E2E8E6}
.legend{display:flex;gap:12px;font-size:13px;color:var(--muted);flex-wrap:wrap}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.empty{padding:34px;text-align:center;color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{padding:8px 16px;border-radius:99px;border:1px solid var(--line);cursor:pointer;background:#fff;transition:background .15s}
.tab:hover{background:var(--soft)}.tab.on{background:var(--p);color:#fff;border-color:var(--p)}
.note{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px;color:var(--p3);line-height:1.55}
.note.warn{background:var(--warnbg);color:#7C4A03;border-color:#FDE68A}
/* ---------- Modal / toast ---------- */
.mask{position:fixed;inset:0;background:rgba(10,40,35,.38);z-index:60;display:grid;place-items:center;padding:16px;opacity:0;transition:opacity .2s}
.mask.in{opacity:1}
.modal{background:#fff;border-radius:18px;max-width:760px;width:100%;max-height:92vh;overflow:auto;padding:22px;box-shadow:0 30px 70px -20px rgba(0,0,0,.35);transform:translateY(14px) scale(.98);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.mask.in .modal{transform:none}.modal.wide{max-width:980px}
.modal h3{font-size:18px;margin-bottom:12px}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--p3);color:#fff;padding:10px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:all .25s;z-index:99;max-width:90vw}
#toast.in{opacity:1;transform:translateX(-50%)}#toast.err{background:var(--bad)}
.spin{display:inline-block;width:18px;height:18px;border:3px solid var(--line);border-top-color:var(--p);border-radius:50%;animation:sp .8s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{position:fixed;inset:0;background:rgba(255,255,255,.7);display:none;place-items:center;z-index:98}.loading.on{display:grid}
/* ---------- Reveal ---------- */
.reveal{opacity:0;transform:translateY(16px);transition:opacity .5s ease,transform .5s cubic-bezier(.2,.8,.2,1)}.reveal.in{opacity:1;transform:none}
/* ---------- Assess form ---------- */
.assess{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.aside{position:sticky;top:76px}
.q{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:9px 10px;border-bottom:1px solid #EEF5F3;border-radius:10px;cursor:pointer}
.q.cur{background:var(--soft2);outline:2px solid rgba(18,165,140,.35)}
.q .no{font-family:'Prompt';color:var(--muted);text-align:center}
.opts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.opt{border:1px solid var(--line);border-radius:99px;padding:5px 13px;cursor:pointer;font-size:14.5px;background:#fff;transition:all .12s;user-select:none;white-space:nowrap}
.opt:hover{background:var(--soft)}.opt.on{background:var(--p);color:#fff;border-color:var(--p)}
.dimhead{margin:14px 0 4px;font-family:'Prompt';font-size:14px;color:var(--p3)}
.kbd{display:inline-block;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:0 6px;font-size:12.5px;background:#fff}
/* ---------- Login ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(900px 500px at 85% -10%,var(--soft),transparent),radial-gradient(700px 400px at -10% 110%,#DFF5EF,transparent),#fff}
.lbox{width:100%;max-width:410px;text-align:center}
.lbox .card{padding:26px;text-align:left}
.lbox .logoL{width:92px;height:92px;margin:0 auto 12px;display:grid;place-items:center}.lbox .logoL img{max-width:100%;max-height:100%}
.lbox h1{font-size:21px;line-height:1.35;margin-bottom:4px;text-align:center}
.lbox.wide{max-width:720px}
.mcards{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:6px}
.mcard{all:unset;box-sizing:border-box;cursor:pointer;display:block;text-align:left;background:#fff;border:1.5px solid var(--soft);border-radius:20px;padding:24px 22px;transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}
.mcard:hover,.mcard:focus-visible{transform:translateY(-4px);border-color:var(--p);box-shadow:0 14px 30px rgba(14,140,120,.14)}
.mcard:active{transform:scale(.98)}
.mcard .mi{width:54px;height:54px;border-radius:16px;background:var(--soft2);display:grid;place-items:center;font-size:28px;margin-bottom:14px}
.mcard b{display:block;font-size:18px;margin-bottom:6px;color:var(--ink)}
.mcard span.d{display:block;font-size:14px;line-height:1.65;color:var(--muted)}
.mcard .go{display:inline-block;margin-top:14px;font-weight:600;color:var(--p)}
.backlnk{background:none;border:0;color:var(--muted);cursor:pointer;font:inherit;margin-top:14px;padding:6px 10px}
.backlnk:hover{color:var(--p)}
@media (max-width:620px){.mcards{grid-template-columns:1fr}.mcard{padding:18px}}
.cred{font-size:12.5px;color:var(--muted);line-height:1.7;margin-top:16px;text-align:center}

#pv{position:fixed;inset:0;z-index:90;background:#D8E3E0;overflow:auto;display:none}

.sheet{width:210mm;min-height:297mm;background:#fff;margin:14px auto;padding:12mm 14mm 12mm 18mm;box-shadow:0 2px 14px rgba(0,0,0,.25);color:#000;font-family:'TH SarabunPSK','Sarabun',sans-serif;font-size:16pt;line-height:1.15;position:relative;page-break-after:always;break-after:page;overflow:hidden}

.sheet .hd img{height:15mm}
.sheet table{border-collapse:collapse;width:100%}
.sheet td,.sheet th{border:1px solid #000;padding:1px 5px;vertical-align:middle}

.sheet .dots{display:inline-block;border-bottom:1px dotted #000;min-width:30mm;padding:0 2mm;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}
@media (max-width:980px){
  .side{position:fixed;left:0;top:0;z-index:50;height:100vh;height:100dvh;transform:translateX(-105%);transition:transform .3s,visibility 0s linear .3s;width:min(300px,86vw)!important;flex-basis:auto!important;box-shadow:none;visibility:hidden}

const THM=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const todayIso = ()=>{ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
function fmtThai(iso,short){ const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(iso||''); if(!m) return ''; return (+m[3])+' '+(short?THM[+m[2]-1].slice(0,short===true?3:short):THM[+m[2]-1])+' '+(+m[1]+543); }
function fmtBE(iso){ const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(iso||''); return m?m[3]+'/'+m[2]+'/'+(+m[1]+543):''; }
const THM_AB=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function thMonth(t){ t=String(t).trim(); if(/^\d{1,2}$/.test(t)) return +t; let i=THM.indexOf(t); if(i<0) i=THM_AB.indexOf(t.replace(/\.?$/,'.')); if(i<0) i=THM.findIndex(n=>t.length>=3&&n.indexOf(t)===0); return i+1; }
function parseBE(s){   /* dd/mm/พ.ศ. หรือ dd/mm/ค.ศ. (เดือนเป็นเลขหรือชื่อเดือนไทย เช่น 5/ธันวาคม/2556) → ISO (ค.ศ.) */
  const m=/^\s*(\d{1,2})\s*[\/\-.\s]\s*(\d{1,2}|[฀-๿.]{2,})\s*[\/\-.\s]\s*(\d{4})\s*$/.exec(String(s||'')); if(!m) return '';
  let y=+m[3]; if(y>2400) y-=543; const mo=thMonth(m[2]), d=+m[1]; if(mo<1||mo>12||d<1||d>31) return '';
  return y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0');
}
const thDigits = s=>String(s).replace(/\d/g,d=>'๐๑๒๓๔๕๖๗๘๙'[d]);
function ageAt(birth,at){ const b=/^(\d{4})-(\d{2})-(\d{2})/.exec(birth||''); if(!b) return null; const a=/^(\d{4})-(\d{2})-(\d{2})/.exec(at||todayIso());
  let y=+a[1]-+b[1]; if(+a[2]<+b[2]||(+a[2]===+b[2]&&+a[3]<+b[3])) y--; return y; }

function sdqCalc(form,rec){
  const cut = CUT[form==='s'?'s':'tp'], d=[0,0,0,0,0], a=(rec&&rec.a)||[]; let miss=0;
  for(let i=0;i<25;i++){ const v=a[i]; if(v==null||v===''){ miss++; continue; } d[SDQ_MAP[i]-1] += SDQ_REV.has(i+1)?2-(+v):+v; }
  const tot=d[0]+d[1]+d[2]+d[3];
  const lv={emo:lvl(d[0],cut.emo),con:lvl(d[1],cut.con),hyp:lvl(d[2],cut.hyp),peer:lvl(d[3],cut.peer),tot:lvl(tot,cut.tot)};
  const pro = d[4]>=4?'s':'x';
  const I = rec&&rec.imp, areas = impAreas(form); let imp=null, impDone=false;
  if(I && I.q1!=null && I.q1!==''){
    if(+I.q1===0){ imp={score:0,lv:'n'}; impDone=true; }
    else{
      const ifr=I.ifr||[], ok = I.dis!=null && I.dis!=='' && areas.every((_,j)=>ifr[j]!=null&&ifr[j]!=='');
      const sc=(I.dis!=null&&I.dis!==''?IMP_PT[+I.dis]:0)+areas.reduce((s,_,j)=>s+(ifr[j]!=null&&ifr[j]!==''?IMP_PT[+ifr[j]]:0),0);
      imp={score:sc, lv: sc===0?'n':sc<=2?'r':'p'}; impDone=ok;
    }
  }
  return {d,tot,lv,pro,miss,done:miss===0,imp,impDone,
          worst:worst([lv.emo,lv.con,lv.hyp,lv.peer,lv.tot]), problemDims:SDQ_DIMS.slice(0,4).filter((x,i)=>lv[x.k]!=='n').map(x=>x.s)};
}

function eqCalc(rec){
  const a=(rec&&rec.a)||[], pts=[]; let miss=0;

  const sub=EQ_SUB.map(s=>{ let x=0; for(let n=s.r[0];n<=s.r[1];n++) x+=pts[n-1]; return x; });
  const dom={good:0,smart:0,happy:0}; EQ_SUB.forEach((s,i)=>{ dom[s.d]+=sub[i]; });
  const total=dom.good+dom.smart+dom.happy, norms=(Store.settings&&Store.settings.eq_norms)||null;
  const lev=(k,x)=>{ const n=norms&&norms[k]; if(!n||n.lo==null||n.hi==null||n.lo===''||n.hi==='') return ''; return x<+n.lo?'lo':x>+n.hi?'hi':'mid'; };
  const sl=sub.map((x,i)=>{ const n=norms&&norms.sub&&norms.sub[i]; if(!n||n.lo==null||n.hi==null||n.lo===''||n.hi==='') return ''; return x<+n.lo?'lo':x>+n.hi?'hi':'mid'; });
  return {sub,dom,total,miss,done:miss===0,lv:{good:lev('good',dom.good),smart:lev('smart',dom.smart),happy:lev('happy',dom.happy),total:lev('total',total),sub:sl}};
}

const GROWTH = {"F_aw": [[12, 29.5, 53.0], [13, 33.0, 55.5], [14, 36.5, 56.5], [15, 38.5, 57.0], [16, 40.0, 57.5], [17, 41.0, 57.5], [18, 41.5, 58.0]], "F_ah": [[12, 139.0, 160.5], [13, 143.5, 162.5], [14, 147.0, 163.5], [15, 148.5, 164.0], [16, 149.0, 164.0], [17, 149.5, 164.0], [18, 150.0, 164.5]], "F_hw": [[130, 135, 22.5, 38.0], [136, 140, 25.5, 42.5], [141, 145, 28.5, 47.0], [146, 150, 31.5, 51.5], [151, 155, 35.5, 55.5], [156, 160, 34.0, 59.0], [161, 165, 43.0, 62.5], [166, 170, 46.5, 65.5]], "M_aw": [[12, 28.0, 54.5], [13, 32.5, 58.5], [14, 35.5, 61.5], [15, 40.0, 64.0], [16, 44.0, 66.0], [17, 46.5, 67.0], [18, 48.0, 68.0]], "M_ah": [[12, 135.5, 164.5], [13, 141.0, 170.0], [14, 147.5, 173.0], [15, 153.5, 176.0], [16, 158.5, 177.0], [17, 160.5, 177.5], [18, 161.5, 179.0]], "M_hw": [[130, 135, 23.5, 37.0], [136, 140, 26.0, 41.5], [141, 145, 28.0, 45.0], [146, 150, 31.5, 49.0], [151, 155, 34.5, 58.0], [156, 160, 38.0, 57.5], [161, 165, 42.0, 61.5], [166, 170, 45.5, 65.5], [171, 175, 44.5, 69.0], [176, 180, 53.0, 72.5]]};
function growthEval(sex,birth,w,h,at){
  const pre = sex==='ญ'?'F':sex==='ช'?'M':null, out={aw:null,ah:null,hw:null,note:''};
  if(!pre) return Object.assign(out,{note:'ยังไม่ระบุเพศ'});
  const age=ageAt(birth,at), W=parseFloat(w), H=parseFloat(h);
  const cmp=(x,lo,hi)=>x<lo?'ต่ำกว่าเกณฑ์':x>hi?'สูงกว่าเกณฑ์':'ตามเกณฑ์';
  if(age==null) out.note='ยังไม่ระบุวันเกิด';
  else if(age<12||age>18) out.note='อายุ '+age+' ปี อยู่นอกช่วงตาราง (12–18 ปี)';
  else{
    const aw=GROWTH[pre+'_aw'].find(r=>r[0]===age), ah=GROWTH[pre+'_ah'].find(r=>r[0]===age);
    if(aw&&W>0) out.aw=cmp(W,aw[1],aw[2]); if(ah&&H>0) out.ah=cmp(H,ah[1],ah[2]);
  }
  if(H>0&&W>0){ const hh=Math.floor(H), r=GROWTH[pre+'_hw'].find(r=>hh>=r[0]&&hh<=r[1]); if(r) out.hw=cmp(W,r[2],r[3]); else if(!out.note) out.note='ส่วนสูงอยู่นอกช่วงตารางน้ำหนัก-ส่วนสูง'; }
  return out;
}

    google.script.run

  const D={Users:{},Students:{},Assessments:{},Cares:{},Settings:mergeSettings({})}; let seeded=false, sess={};
  function rng(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
  function seed(){
    if(seeded) return; seeded=true; const R=rng(7);
    D.Users.admin={username:'admin',pass:'admin1234',name:'นางสาวกานต์มณี แก้วพวง',role:'Admin',status:'active',classes:[],position:'งานจัดระบบการบริหารและพัฒนาองค์กร'};
    D.Users.t1={username:'t1',pass:'1234',name:'นางสาวตัวอย่าง ครูที่ปรึกษา',role:'Teacher',status:'active',classes:['ม.1/1'],position:'ครู'};
    D.Users.v1={username:'v1',pass:'1234',name:'นางตัวอย่าง ผู้อำนวยการ',role:'Viewer',status:'active',classes:[],position:'ผู้อำนวยการ'};
    const fn=['สมชาย','สมหญิง','ธนากร','พิมพ์ชนก','กฤษดา','ณัฐธิดา','วีรภัทร','ปาณิสรา','อนุชา','ชลธิชา','พงศธร','กมลชนก','ภูมิพัฒน์','รุ่งนภา'];
    fn.forEach((n,i)=>{ const id=String(12000+i), cls=i<10?'ม.1/1':'ม.2/1', sex=i%2?'ญ':'ช', y=(cls==='ม.1/1'?2556:2555)-543+0;
      D.Students[id]={id,no:String(i%10+1),name:(sex==='ช'?'เด็กชาย':'เด็กหญิง')+n+' ใจดี',cls,sex,birth:(y)+'-'+String(i%12+1).padStart(2,'0')+'-'+String(i%27+1).padStart(2,'0'),parent:'ผู้ปกครองของ'+n}; });
    const rd=Store.settings.academic_year+'-'+Store.settings.term;
    Object.keys(D.Students).slice(0,9).forEach((id,i)=>{ ['t','s','p'].forEach((f,j)=>{ if(R()<.2) return;
      const a=Array.from({length:25},()=>{ const x=R(); return x<.5?0:x<.85?1:2; });
      if(i%3===0) [2,9,14,15,4].forEach(k=>{ a[k]=2; });
      D.Assessments[id+'_'+rd+'_'+f]={sid:id,round:rd,form:f,a,imp:{q1:i%3===0?2:0,dur:1,dis:i%3===0?2:null,ifr:i%3===0?[1,2,1,0].slice(0,f==='t'?2:4):[],burden:1},signer:{role:'ครูที่ปรึกษา',name:'นางสาวตัวอย่าง'},date:todayIso(),source:'teacher'}; });
      if(i%2===0) D.Assessments[id+'_'+rd+'_eq']={sid:id,round:rd,form:'eq',a:Array.from({length:52},()=>Math.floor(R()*4)),source:'teacher',date:todayIso()}; });
    D.Cares['12000']={status:'กำลังดูแล',log:[{d:todayIso(),by:'t1',txt:'พูดคุยให้คำปรึกษาเบื้องต้น นัดติดตามผลอีก 2 สัปดาห์'}]};
  }
  const pub=u=>{ const c=Object.assign({},u); delete c.pass; delete c.initpw; return c; }, adm=u=>{ const c=Object.assign({},u); delete c.pass; return c; };
  const load=u=>{ const S={},A={},C={},U={}; const cl=u.classes||[];
    Object.values(D.Students).forEach(s=>{ if(u.role!=='Teacher'||cl.indexOf(s.cls)>=0) S[s.id]=s; });
    Object.keys(D.Assessments).forEach(k=>{ if(S[D.Assessments[k].sid]) A[k]=D.Assessments[k]; });
    Object.keys(D.Cares).forEach(k=>{ if(S[k]) C[k]=D.Cares[k]; });
    if(u.role==='Admin') Object.values(D.Users).forEach(x=>{U[x.username]=adm(x);}); else U[u.username]=pub(u);
    return {settings:D.Settings,Users:U,Students:S,Assessments:A,Cares:C}; };
  const me=t=>{ const u=D.Users[sess[t]]; if(!u) throw new Error('AUTH_EXPIRED: เซสชันหมดอายุ'); return u; };
  return {
    apiLogin(u,p,mode){ seed(); const x=Object.values(D.Users).find(a=>a.username===String(u).trim().toLowerCase());
      if(!x||x.pass!==p) throw new Error('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
      if(mode==='admin'&&x.role!=='Admin') throw new Error('บัญชีนี้ไม่ใช่ผู้ดูแลระบบ — กรุณากลับไปเลือกโหมด “ครูประจำชั้น / ผู้บริหาร”');
      if(mode==='teacher'&&x.role==='Admin') throw new Error('บัญชีผู้ดูแลระบบ — กรุณากลับไปเลือกโหมด “แอดมิน”'); const t='demo'+Math.random().toString(36).slice(2); sess[t]=x.username;
      return {ok:true,token:t,user:pub(x),data:load(x)}; },
    apiResume(t){ seed(); const u=me(t); return {ok:true,user:pub(u),data:load(u)}; },
    apiLogout(t){ delete sess[t]; return {ok:true}; },
    apiChangePassword(t,j){ const u=me(t),p=JSON.parse(j); if(u.pass!==p.old) throw new Error('รหัสผ่านเดิมไม่ถูกต้อง'); u.pass=p.new; u.initpw=''; return {ok:true}; },
    apiIssueAccounts(t,j){ const u=me(t),p=JSON.parse(j); if(u.role!=='Admin') throw new Error('เฉพาะแอดมิน'); const out=[], used={};
      (p.items||[]).forEach(it=>{ let un,d; if(it.kind==='hr'){ const c=String(it.cls||'').trim(); if(!c) return; un='hr_'+(c.replace(/^ม\.?/,'m').replace(/\//g,'_').replace(/[^a-z0-9_]/g,'')||'c'); d={username:un,name:'ครูประจำชั้น '+c,position:'ครูที่ปรึกษา '+c,role:'Teacher',status:'active',classes:[c]}; }
        else { un=String(it.username||'').toLowerCase().replace(/[^a-z0-9_.]/g,''); if(!un) return; d={username:un,name:it.name||'ผู้บริหาร',position:it.position||'ผู้บริหาร',role:'Viewer',status:'active',classes:[]}; }
        if(used[un]) return; used[un]=1; const ex=D.Users[un]; if(ex&&ex.role==='Admin') return;
        if(ex&&!p.reset){ out.push({username:un,name:ex.name,role:ex.role,classes:ex.classes||[],password:ex.initpw||'',isNew:false}); return; }
        const pw=Array.from({length:6},()=>'abcdefghjkmnpqrstuvwxyz23456789'[Math.floor(Math.random()*31)]).join('');
        if(ex){ delete d.name; delete d.position; } D.Users[un]=Object.assign({},ex||{},d,{pass:pw,initpw:pw}); out.push({username:un,name:D.Users[un].name,role:d.role,classes:d.classes,password:pw,isNew:!ex}); });
      return {ok:true,accounts:out}; },
    apiCommit(t,j){ const u=me(t); if(u.role==='Viewer') throw new Error('บัญชีผู้บริหารดูข้อมูลได้อย่างเดียว');
      JSON.parse(j).forEach(o=>{ if(o.c==='Settings'){ D.Settings=mergeSettings(Object.assign({},D.Settings,o.data)); return; }
        const c=D[o.c]; if(o.op==='delete'){ delete c[o.id]; return; }
        const d=Object.assign({},o.data||{}); if(o.c==='Users'&&d.newpass){ d.pass=d.newpass; d.initpw=d.newpass; delete d.newpass; }
        c[o.id]=o.op==='merge'?Object.assign({},c[o.id]||{},d):d; }); return {ok:true}; },
    apiImportStudents(t,j){ me(t); const rows=JSON.parse(j); let n=0; rows.forEach(r=>{ if(r.id&&r.name&&r.cls){ D.Students[r.id]=Object.assign({},D.Students[r.id]||{},r); n++; } }); return {ok:true,added:n,skipped:[]}; },
    apiImportUsers(t,j){ me(t); const rows=JSON.parse(j); let n=0; rows.forEach(r=>{ if(r.username&&r.name){ D.Users[r.username]={username:r.username,pass:r.password||r.username,name:r.name,position:r.position||'',role:r.role||'Teacher',status:'active',classes:String(r.classes||'').split(',').map(x=>x.trim()).filter(String)}; n++; } }); return {ok:true,added:n,skipped:[]}; },
    apiPublicRoster(j){ seed(); const p=JSON.parse(j), rd=Store.settings.academic_year+'-'+Store.settings.term;
      return {ok:true,verify:!!Store.settings.public_verify,items:Object.values(D.Students).map(s=>({id:s.id,no:s.no,name:s.name,cls:s.cls,done:!!D.Assessments[s.id+'_'+rd+'_'+p.form],locked:false}))}; },
    apiPublicLookup(j){ seed(); const p=JSON.parse(j),s=D.Students[String(p.id).trim()]; if(!s||(Store.settings.public_verify&&s.birth&&s.birth!==p.birth)) throw new Error('ไม่พบข้อมูล หรือวันเดือนปีเกิดไม่ตรงกับในระบบ');
      return {ok:true,name:s.name,cls:s.cls,no:s.no,done:false,locked:false}; },
    apiPublicSubmit(j){ seed(); const p=JSON.parse(j),s=D.Students[String(p.id).trim()]; if(!s) throw new Error('ไม่พบข้อมูล'); const rd=Store.settings.academic_year+'-'+Store.settings.term;
      D.Assessments[s.id+'_'+rd+'_'+p.form]={sid:s.id,round:rd,form:p.form,a:p.a,imp:p.imp||null,signer:p.signer||null,source:'link',date:todayIso()}; return {ok:true}; }
  };
})();

<script>
'use strict';
/* =====================================================================

   ===================================================================== */
const ALL = ['Admin','Teacher','Viewer'];
const NAV = [
  {id:'assess',  g:'ประเมิน',           t:'ประเมิน SDQ (ครู) / บันทึกผล', ic:'📝', roles:['Teacher']},
  {id:'send',    g:'ประเมิน',           t:'ส่งลิงก์ · พิมพ์แบบกระดาษ',   ic:'🔗', roles:['Admin','Teacher']},
  {id:'dash',    g:'ภาพรวมและรายงาน',   t:'ภาพรวม',               ic:'📊', roles:ALL},

  {id:'results', g:'ภาพรวมและรายงาน',   t:'ผลการประเมิน',          ic:'📈', roles:ALL},

  {id:'print',   g:'ภาพรวมและรายงาน',   t:'เอกสารพิมพ์',           ic:'🖨️', roles:ALL},
  {id:'memo',    g:'ภาพรวมและรายงาน',   t:'ออกรายงาน (บันทึกข้อความ)', ic:'📄', roles:ALL},
  {id:'users',   g:'ผู้ดูแลระบบ',       t:'ผู้ใช้งาน',             ic:'👥', roles:['Admin']},
  {id:'update',  g:'ผู้ดูแลระบบ',       t:'อัปเดตระบบ',            ic:'⬆️', roles:['Admin']},
  {id:'settings',g:'ผู้ดูแลระบบ',       t:'ตั้งค่าระบบ',           ic:'⚙️', roles:['Admin']}];
const landing = ()=>(Store.user&&Store.user.role==='Teacher')?'assess':'dash';   /* แอดมิน/ครู เข้าแล้วเจอหน้าประเมินก่อน */
const NOFILTER = ['memo','users','settings','assess'];
let cur = 'assess';
function enter(){ go(landing()); if(Store.user.role==='Teacher') setTimeout(()=>checkComplete(),700); }
const VIEWS = {}, AFTER = {};
const creditsSide = ()=>{ const c=Store.settings.credits; return '<div class="cr0">พัฒนาระบบโดย</div><div class="cr1">'+esc(c.dev1)+'</div><div class="cr2">'+esc(c.dev1_role)+'</div><div class="cr1">'+esc(c.dev2)+'</div><div class="cr2">'+esc(c.dev2_role)+'</div>'; };

const LOGIN_MODES = {
  teacher:{t:'โหมดครูประจำชั้น / ผู้บริหาร', ic:'🏫', d:'ดูข้อมูลเฉพาะชั้นที่ดูแล บันทึกการประเมิน ติดตามนักเรียนกลุ่มเสี่ยง และดาวน์โหลดบันทึกข้อความรายงานเจาะลึกรายชั้น (ผู้บริหารดูได้ทุกชั้น)', ph:'ครูประจำชั้น / ผู้บริหาร'},
  admin:{t:'โหมดแอดมิน', ic:'🛡️', d:'จัดการระบบทั้งโรงเรียน: นำเข้ารายชื่อนักเรียน ตั้งค่าเกณฑ์ ออกรหัสและลิงก์ให้ครูประจำชั้น/ผู้บริหาร และออกรายงานภาพรวมทั้งโรงเรียน', ph:'ผู้ดูแลระบบ'}};
function loginView(mode){
  const s=Store.settings, head='<div class="logoL">'+logoImg()+'</div><h1>ระบบประเมิน SDQ และ EQ<br>'+esc(s.school_info.name)+'</h1><div class="muted" style="margin-bottom:16px">ระบบคัดกรองพฤติกรรมและความฉลาดทางอารมณ์ของนักเรียน</div>';
  if(!mode){
    $('#root').innerHTML='<div class="login"><div class="lbox wide reveal in">'+head
     +'<div style="font-weight:600;margin:4px 0 12px">เลือกโหมดการเข้าใช้งาน</div><div class="mcards">'
     +Object.keys(LOGIN_MODES).map(k=>'<button class="mcard" data-m="'+k+'" type="button"><div class="mi">'+LOGIN_MODES[k].ic+'</div><b>'+LOGIN_MODES[k].t+'</b><span class="d">'+LOGIN_MODES[k].d+'</span><span class="go">เข้าสู่ระบบ →</span></button>').join('')
     +'</div><div style="text-align:center;margin-top:14px;font-size:13px;color:var(--mut)">เวอร์ชัน '+esc(APP_VERSION)+' · <a href="'+UPD_CENTER+'" target="_blank" rel="noopener" style="color:var(--p);font-weight:600">⬆️ ศูนย์อัปเดตระบบ</a></div><div class="cred">'+creditsHtml()+'</div></div></div>';

   +'<label class="f">ชื่อผู้ใช้<input id="lu" autocomplete="username" autocapitalize="off" value="'+esc(pre)+'"></label>'
   +'<label class="f" style="margin-top:12px">รหัสผ่าน<input id="lp" type="password" autocomplete="current-password"></label>'
   +'<button class="btn pri" id="lb" style="width:100%;margin-top:16px;padding:11px">เข้าสู่ระบบ</button>'
   +(MODE==='demo'?'<div class="note" style="margin-top:12px">โหมดทดลอง (ข้อมูลไม่ถูกบันทึก): '+(mode==='admin'?'<b>admin</b> / admin1234':'<b>t1</b> / 1234 (ครูประจำชั้น ม.1/1) · <b>v1</b> / 1234 (ผู้บริหาร)')+'</div>':'')

  const go1=async()=>{ const u=val('lu'), p=document.getElementById('lp').value; if(!u||!p) return toast('กรอกชื่อผู้ใช้และรหัสผ่าน',true);

    Store.token=r.token; ss.set('tok',r.token); Store.round=''; Store.cls=''; loadData(r); shell(); enter(); };
  $('#lb').onclick=go1; $('#lback').onclick=()=>loginView(); $('#lp').addEventListener('keydown',e=>{ if(e.key==='Enter') go1(); }); $('#lu').addEventListener('keydown',e=>{ if(e.key==='Enter') $('#lp').focus(); });

async function logout(){ try{ await gasCall('apiLogout',tok()); }catch(e){} ss.del('tok'); Store.token=''; Store.user=null; Store.Students={}; Store.Assessments={}; loginView(); }

function shell(){
  const s=Store.settings, u=Store.user, nav=NAV.filter(n=>n.roles.indexOf(u.role)>=0);

   +'<nav>'+(()=>{ let lg=''; return nav.map(n=>{ let h=''; if(n.g!==lg){ lg=n.g; h='<div class="navgrp">'+esc(lg)+'</div>'; } return h+'<div class="nav" data-v="'+n.id+'" onclick="go(\''+n.id+'\')"><span class="ic">'+n.ic+'</span><span class="navlbl">'+esc(n.t)+'</span></div>'; }).join(''); })()+'</nav>'

/* ---- แถบเมนูข้าง: มือถือเปิด/ปิดได้ (☰, ✕, แตะพื้นหลัง, ปัดซ้าย, Esc) ---- */
function openSide(){ const s=$('#side'); if(!s) return; s.classList.add('open'); $('#sback').classList.add('on'); document.body.classList.add('noscroll'); }
function closeSide(){ const s=$('#side'); if(!s) return; s.classList.remove('open'); const b=$('#sback'); if(b) b.classList.remove('on'); document.body.classList.remove('noscroll'); }
function toggleSide(){ const s=$('#side'); if(s&&s.classList.contains('open')) closeSide(); else openSide(); }
function toggleMini(){ if(innerWidth<=980) return closeSide(); $('#side').classList.toggle('mini'); }
(function(){ let x0=null,y0=0;
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeSide(); });
  addEventListener('resize',()=>{ if(innerWidth>980) closeSide(); });
  document.addEventListener('touchstart',e=>{ const s=$('#side'); if(s&&s.classList.contains('open')&&e.touches.length===1){ x0=e.touches[0].clientX; y0=e.touches[0].clientY; } else x0=null; },{passive:true});
  document.addEventListener('touchend',e=>{ if(x0==null) return; const t=e.changedTouches[0], dx=t.clientX-x0, dy=Math.abs(t.clientY-y0); x0=null; if(dx<-50&&dy<60) closeSide(); },{passive:true});
})();
function topControls(){
  const el=$('#topctl'); if(!el) return;
  if(cur==='send'){ el.innerHTML='<select class="inp" id="fcls" style="width:auto" onchange="Store.cls=this.value;render()"><option value="">ทุกห้อง</option>'+opt(classes(),Store.cls)+'</select>'; return; }
  if(NOFILTER.indexOf(cur)>=0 && cur!=='assess'){ el.innerHTML=''; return; }
  const cl=classes();
  el.innerHTML=(cur==='assess'?'':'<select class="inp" id="fcls" style="width:auto" onchange="Store.cls=this.value;render()"><option value="">ทุกห้อง</option>'+opt(cl,Store.cls)+'</select>')
    +'<select class="inp" id="frd" style="width:auto" onchange="Store.round=this.value;render()">'+opt(rounds().map(r=>[r,roundTh(r)]),Store.round)+'</select>';
}
function go(id){
  cur=id; const n=NAV.find(x=>x.id===id)||NAV[0];
  $$('.nav').forEach(e=>e.classList.toggle('on',e.dataset.v===id)); closeSide();
  $('#ttl').textContent=n.t; topControls(); render(); window.scrollTo(0,0);
}
function render(){
  const v=$('#view'); if(!v) return;

  v.innerHTML=(VIEWS[cur]||(()=>''))(); (AFTER[cur]||(()=>{}))();
  $$('.card,.tw',v).forEach(e=>e.classList.add('reveal')); initReveal();

function xlDate(v){ if(v instanceof Date) return v.getFullYear()+'-'+String(v.getMonth()+1).padStart(2,'0')+'-'+String(v.getDate()).padStart(2,'0');
  if(typeof v==='number'&&v>20000&&window.XLSX){ const d=XLSX.SSF.parse_date_code(v); return d.y+'-'+String(d.m).padStart(2,'0')+'-'+String(d.d).padStart(2,'0'); } return parseBE(v); }
function tableToRows(aoa,map){   /* aoa แถวแรกเป็นหัวตาราง; map: {key:[คำที่ใช้จับหัวคอลัมน์]} */
  if(!aoa.length) return []; const hd=aoa[0].map(x=>String(x||'').replace(/\s/g,'')), idx={};
  Object.keys(map).forEach(k=>{ let ix=-1; for(const w of map[k]){ ix=hd.indexOf(w); if(ix>=0) break; } if(ix<0) for(const w of map[k]){ ix=hd.findIndex(h=>h.indexOf(w)>=0); if(ix>=0) break; } idx[k]=ix; });   /* ตรงทั้งคำก่อน แล้วค่อยหาคำที่มีอยู่ในหัวคอลัมน์ (ไล่ตามลำดับความสำคัญ) */
  return aoa.slice(1).filter(r=>r.some(c=>String(c||'').trim())).map(r=>{ const o={}; Object.keys(idx).forEach(k=>{ o[k]=idx[k]>=0?r[idx[k]]:''; }); return o; });
}

function sdqBlock(sid,f,rd){
  const r=getRec(sid,f,rd); if(!r) return '<div class="card"><h3>'+FORMS[f].n+'</h3><div class="muted">ยังไม่ได้ประเมิน</div></div>';

   +names.map((k,i)=>'<tr><td>'+SDQ_DIMS[i].t+'</td><td class="tc">'+c.d[i]+'</td><td>'+chip(c.lv[k])+'</td><td class="muted">'+cut[k]+'</td></tr>').join('')
   +'<tr><td><b>คะแนนรวมปัญหา 4 ด้าน</b></td><td class="tc"><b>'+c.tot+'</b></td><td>'+chip(c.lv.tot)+'</td><td class="muted">'+cut.tot+'</td></tr>'
   +'<tr><td>'+SDQ_DIMS[4].t+'</td><td class="tc">'+c.d[4]+'</td><td>'+chip(c.pro)+'</td><td class="muted">มีจุดแข็ง 4–10 / ไม่มี 0–3</td></tr>'
   +'<tr><td>ผลกระทบ (ด้านหลังแบบประเมิน)</td><td class="tc">'+(c.imp?c.imp.score:'–')+'</td><td>'+(c.imp?chip(c.imp.lv):'<span class="chip x">ยังไม่ตอบ</span>')+'</td><td class="muted">0 / 1–2 / 3–10</td></tr></table></div></div>';
}

  ['ครู','นักเรียน','ผู้ปกครอง'].forEach(n=>{ ['อารมณ์','เกเร','ไม่อยู่นิ่ง','เพื่อน','รวมปัญหา','แปลผลรวม','จุดแข็ง','ผลกระทบ'].forEach(d=>head.push('SDQ'+n+':'+d)); });
  ['ดี','เก่ง','สุข','รวม','แปลผล'].forEach(d=>head.push('EQ:'+d)); head.push('ภาพรวม(ระดับสูงสุด)');
  const rows=visibleStudents().map(s=>{ const m=summary(s,rd), r=[s.no,s.id,s.name,s.cls,s.sex];

    if(m.eq) r.push(m.eq.dom.good,m.eq.dom.smart,m.eq.dom.happy,m.eq.total,EQ_LV_TH[m.eq.lv.total]); else r.push('','','','','');
    r.push(LV_TH[m.worst]||''); return r; });
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([head].concat(rows)),'ผล SDQ-EQ'); XLSX.writeFile(wb,'ผลSDQ-EQ_'+rd+(Store.cls?'_'+Store.cls.replace(/[\/\\]/g,'-'):'')+'.xlsx');

<script>
'use strict';
/* =====================================================================
   บันทึกการประเมิน / เอกสารพิมพ์ (ตัวเลือก) / ผู้ใช้งาน / ตั้งค่า / ออกรายงาน
   ===================================================================== */
const A = {form:'t', cls:'', sid:'', draft:null, cur:0};
const FORM_TABS = [['t','SDQ ครู'],['s','SDQ นักเรียน'],['p','SDQ ผู้ปกครอง'],['eq','EQ']];
function draftFor(sid,form){
  const ex=getRec(sid,form,Store.round), n=form==='eq'?52:25;
  if(ex){ const d=JSON.parse(JSON.stringify(ex)); if(form!=='eq'&&!d.imp) d.imp={q1:null,dur:null,dis:null,ifr:[],burden:null};
    if(form==='t'&&!d.signer) d.signer={role:'ครูที่ปรึกษา',name:Store.user.name}; if(form==='p'&&!d.signer) d.signer={role:'พ่อ/แม่',name:''}; if(!d.date) d.date=todayIso(); return d; }
  return {sid,round:Store.round,form,a:Array(n).fill(null),imp:form==='eq'?null:{q1:null,dur:null,dis:null,ifr:[],burden:null},
          signer:form==='t'?{role:'ครูที่ปรึกษา',name:Store.user.name}:form==='p'?{role:'พ่อ/แม่',name:''}:null,date:todayIso()};
}
function stMark(s){ const r=getRec(s.id,A.form); if(!r) return ''; const c=A.form==='eq'?eqCalc(r):sdqCalc(A.form,r); return c.done?' ✓':' ◐'; }
function asList(){ return students().filter(s=>s.cls===A.cls); }
VIEWS.assess=()=>{
  Store.round=curRound(); const cl=classes();
  if(!A.cls||cl.indexOf(A.cls)<0) A.cls=Store.cls&&cl.indexOf(Store.cls)>=0?Store.cls:(cl[0]||'');
  const list=asList(); if(A.sid&&!Store.Students[A.sid]) A.sid=''; if(A.sid&&Store.Students[A.sid].cls!==A.cls) A.cls=Store.Students[A.sid].cls;
  const L2=asList(); if(!A.sid||!L2.some(s=>s.id===A.sid)) A.sid=L2.length?L2[0].id:'';
  A.draft=A.sid?draftFor(A.sid,A.form):null; A.cur=A.draft?Math.max(0,A.draft.a.findIndex(x=>x==null)):0; if(A.cur<0) A.cur=0;
  if(!cl.length) return '<div class="card empty">ยังไม่มีนักเรียนในระบบ — ไปที่เมนู “นักเรียน” เพื่อเพิ่มหรือนำเข้ารายชื่อก่อน</div>';
  return '<div class="muted" style="margin-bottom:10px">'+esc(roundTh(Store.round))+' (บันทึกในรอบปัจจุบันตามที่ตั้งค่าไว้)</div>'

   +rows.map((r,i)=>'<tr><td>'+esc(r[0])+'</td><td>'+esc(r[1])+'</td><td style="word-break:break-all;font-size:13px">'+esc(r[3])+'</td><td class="nowrap"><button class="btn sm" data-cp="'+i+'">📋 คัดลอก</button>'+(r[2]?' <button class="btn sm" data-ln="'+esc(r[2])+'">💬</button>':'')+' <button class="btn sm" data-qr="'+esc(r[2])+'">QR</button>'+'</td></tr>').join('')+'</tbody></table></div>'
   +(U.length?'':'<div class="note warn" style="margin-top:10px">ยังไม่มีบัญชีครู/ผู้บริหาร — กด 🔑 ออกรหัส ก่อน</div>')

async function saveSettings(){
  const eq={}; let any=false;
  ['good','smart','happy','total'].forEach(k=>{ const lo=val('eq_'+k+'_lo'), hi=val('eq_'+k+'_hi'); eq[k]={lo:lo===''?'':+lo,hi:hi===''?'':+hi}; if(lo!==''&&hi!=='') any=true; });
  eq.sub=EQ_SUB.map((x,i)=>{ const lo=val('eq_s'+i+'_lo'), hi=val('eq_s'+i+'_hi'); if(lo!==''&&hi!=='') any=true; return {lo:lo===''?'':+lo,hi:hi===''?'':+hi}; });
  for(const q of eq.sub){ if((q.lo===''||q.hi==='')&&!(q.lo===''&&q.hi==='')) return toast('เกณฑ์ EQ ด้านย่อย ต้องกรอกทั้งต่ำสุดและสูงสุด',true); if(q.lo!==''&&q.lo>q.hi) return toast('เกณฑ์ EQ ด้านย่อย: ต่ำสุดต้องไม่เกินสูงสุด',true); }
  for(const k of ['good','smart','happy','total']){ if((eq[k].lo===''||eq[k].hi==='')&&!(eq[k].lo===''&&eq[k].hi==='')) return toast('เกณฑ์ EQ ต้องกรอกทั้งต่ำสุดและสูงสุด',true); if(eq[k].lo!==''&&eq[k].lo>eq[k].hi) return toast('เกณฑ์ EQ: ต่ำสุดต้องไม่เกินสูงสุด',true); }
  const S=Store.settings, data={ academic_year:val('s_yr')||S.academic_year, term:val('s_tm'), pwa_url:val('s_pwa'),
    school_info:{name:val('s_nm')||S.school_info.name,affiliation:val('s_af'),logo:val('s_lg')||LOGO_DEFAULT,director:val('s_dr'),director_pos:val('s_drp'),deputy:val('s_dp'),deputy_pos:val('s_dpp'),counselor:val('s_co'),counselor_pos:val('s_cop')},
    credits:{dev1:val('s_d1'),dev1_role:val('s_d1r'),dev2:val('s_d2'),dev2_role:val('s_d2r')}, memo:{org:val('s_mo'),no:val('s_mn')},
    public_open:{student:$('#s_pub_student').checked,parent:$('#s_pub_parent').checked,eq:$('#s_pub_eq').checked}, public_verify:$('#s_pub_verify').checked, eq_norms:any?eq:null };
  if(await guard(()=>commit([{c:'Settings',op:'merge',id:'main',data}]),'บันทึกการตั้งค่าแล้ว')){ Store.round=curRound(); shell(); go('settings'); }
}

const MEMO_PRESETS = [['deep','รายงานผลเจาะลึกรายชั้น (SDQ รายด้าน/ผู้ประเมิน + EQ + การดูแลช่วยเหลือ)'],['sdq','รายงานผลการคัดกรองพฤติกรรมนักเรียน (SDQ) — ภาพรวม'],['eq','รายงานผลการประเมินความฉลาดทางอารมณ์ (EQ)'],['refer','ขออนุญาตดำเนินการช่วยเหลือนักเรียนกลุ่มมีปัญหา'],['free','เขียนเอง (ว่าง)']];
function memoStats(cls){
  const S=students().filter(s=>!cls||s.cls===cls), rd=curRound(), sums=S.map(s=>summary(s,rd)), all3=sums.filter(m=>m.t&&m.t.done&&m.s&&m.s.done&&m.p&&m.p.done).length;
  const w={n:0,r:0,p:0}; sums.forEach(m=>{ if(m.worst) w[m.worst]++; }); const eqd=sums.filter(m=>m.eq&&m.eq.done);
  const dim={}; ['emo','con','hyp','peer'].forEach(k=>{ dim[k]={}; ['t','s','p'].forEach(f=>{ dim[k][f]=sums.filter(m=>m[f]&&m[f].done&&(m[f].lv[k]==='r'||m[f].lv[k]==='p')).length; }); });
  const care={need:0,doing:0}; S.forEach((s,i)=>{ const wv=sums[i].worst; if(wv==='r'||wv==='p'){ care.need++; if(Store.Cares[s.id]) care.doing++; } });
  const done3={t:0,s:0,p:0}; ['t','s','p'].forEach(f=>{ done3[f]=sums.filter(m=>m[f]&&m[f].done).length; });
  const eqlv={lo:0,mid:0,hi:0}; eqd.forEach(m=>{ if(m.eq.lv.total) eqlv[m.eq.lv.total]++; });
  const eqsub=EQ_SUB.map((x,i)=>eqd.filter(m=>m.eq.lv.sub&&m.eq.lv.sub[i]==='lo').length);
  return {eqsub,N:S.length,all3,anyd:sums.filter(m=>m.done).length,w,eqd:eqd.length,eqlv,norms:!!eqd.length&&!!eqd[0].eq.lv.total,rd,dim,care,done3};
}

  // qrcode
  //---------------------------------------------------------------------

  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+(n+6)+' '+(n+6)+'" shape-rendering="crispEdges" style="width:100%;height:100%;display:block"><rect width="100%" height="100%" fill="#fff"/><path transform="translate(3 3)" d="'+d+'" fill="#000"/></svg>';

   +'<div class="row" style="margin-top:10px;gap:14px"><label><input type="radio" name="qz" value="a4" checked> A4 (1 ป้าย/แผ่น)</label><label><input type="radio" name="qz" value="a5"> A5 (2 ป้าย/แผ่น A4 ตัดแบ่งครึ่ง)</label><label><input type="checkbox" id="qz_u" checked> แสดงชื่อผู้ใช้บนป้าย</label></div>'
   +(items.length>1?'<div class="row" style="margin-top:8px"><label><input type="checkbox" id="qz_all" '+(only?'':'checked')+'> เลือกทั้งหมด</label></div>':'')
   +'<div class="tw" style="margin-top:8px;max-height:46vh;overflow:auto"><table class="t"><tbody>'+items.map((it,i)=>'<tr><td><input type="checkbox" data-qi="'+i+'" '+(sel.indexOf(it)>=0?'checked':'')+'></td><td>'+esc(it.central?'ลิงก์กลาง (ไม่ระบุชื่อ)':it.name)+'</td><td>'+esc(it.central?'':((it.classes||[]).join(', ')||'ทุกห้อง'))+'</td><td>'+esc(it.username||'')+'</td></tr>').join('')+'</tbody></table></div>'
   +(items.length?'':'<div class="note warn" style="margin-top:10px">ยังไม่มีบัญชี — กด 🔑 ออกรหัส ก่อน</div>')
   +'<div class="row" style="margin-top:14px"><span class="sp"></span><button class="btn" id="qz_c">ปิด</button><button class="btn pri" id="qz_p">🖨️ ดูตัวอย่าง / พิมพ์</button></div>');
  const all=$('#qz_all',m); if(all) all.onchange=()=>$$('[data-qi]',m).forEach(c=>c.checked=all.checked);
  $('#qz_c',m).onclick=()=>closeModal(m);
  $('#qz_p',m).onclick=()=>{ const pick=$$('[data-qi]',m).filter(c=>c.checked).map(c=>items[+c.dataset.qi]); if(!pick.length) return toast('เลือกอย่างน้อย 1 ป้าย',true);
    const o={size:($('input[name=qz]:checked',m)||{}).value||'a4',showUser:$('#qz_u',m).checked}; closeModal(m); qrSignsPreview(pick,o); };
}

function lnAcctOne(u,base){
  const link=base+(base.indexOf('?')<0?'?':'&')+'m=t&u='+encodeURIComponent(u.username);
  return '👤 '+u.name+(u.position&&u.position!==u.name?' ('+u.position+')':'')+'\n🔗 ลิงก์เข้าใช้งาน\n'+link+'\nชื่อผู้ใช้: '+u.username+'\nรหัสผ่านเริ่มต้น: '+(u.initpw||'(ตั้งไว้เองแล้ว — ติดต่อแอดมินหากลืม)');
}
function lnText(){
  if(LN.type==='acct'){ const base=(BOOT&&BOOT.url)||'(ลิงก์เว็บแอป)', sc=sch(), all=lnAcctUsers(), pick=LN.user==='__all'||!LN.user?all:(LN.user==='__issued'?all.filter(u=>(LN.issued||[]).indexOf(u.username)>=0):all.filter(u=>u.username===LN.user));
    if(!pick.length) return 'ยังไม่มีบัญชีครูประจำชั้น/ผู้บริหาร — ไปที่เมนู “ผู้ใช้งาน” แล้วกด 🔑 ออกรหัส';
    return '🔑 ข้อมูลเข้าใช้งาน ระบบประเมิน SDQ/EQ · '+sc.name+'\n\n'+pick.map(u=>lnAcctOne(u,base)).join('\n\n')+'\n\n'+LN_ACCT_HINT+(LN.extra?'\n'+LN.extra.trim():'')+'\n\n— '+(sc.counselor||'งานระบบดูแลช่วยเหลือนักเรียน'); }
  const rd=Store.round||curRound(), sc=sch(), L=lnList(), head='📋 ระบบประเมิน SDQ/EQ · '+sc.name+'\n'+roundTh(rd)+(LN.cls?' · ชั้น '+LN.cls:'')+'\n';
  const foot=(LN.extra?'\n'+LN.extra.trim()+'\n':'')+'\n— '+(sc.counselor||'งานระบบดูแลช่วยเหลือนักเรียน');
  const rows=L.map(s=>({s,m:summary(s,rd)}));
  if(LN.type==='summary'){
    const w={n:0,r:0,p:0,x:0}; rows.forEach(x=>{ if(x.m.worst) w[x.m.worst]++; else w.x++; });
    const eqd=rows.filter(x=>x.m.eq&&x.m.eq.done).length;
    return head+'\n👥 นักเรียนทั้งหมด '+L.length+' คน\n✅ ปกติ '+w.n+' คน\n⚠️ เสี่ยง '+w.r+' คน\n🚨 มีปัญหา '+w.p+' คน\n⏳ ยังไม่มีผล SDQ ครบ '+w.x+' คน\n🧠 ทำ EQ แล้ว '+eqd+' คน'+foot;
  }
  if(LN.type==='care'){
    const r=rows.filter(x=>x.m.worst==='r'||x.m.worst==='p').sort((a,b)=>RANK[b.m.worst]-RANK[a.m.worst]);
    if(!r.length) return head+'\nไม่มีนักเรียนกลุ่มเสี่ยง/มีปัญหา 🎉'+foot;
    return head+'\nนักเรียนที่ต้องดูแลช่วยเหลือ '+r.length+' คน\n'+r.map((x,i)=>(i+1)+'. '+(x.m.worst==='p'?'🚨':'⚠️')+' '+lnWho(x.s)+(x.m.dims.length?' — '+x.m.dims.join(', '):'')).join('\n')+'\n\n(ข้อมูลเป็นความลับ โปรดอย่าส่งต่อ)'+foot;
  }
  if(LN.type==='remind'){
    const by={}; rows.forEach(x=>{ const miss=[]; if(!(x.m.t&&x.m.t.done)) miss.push('ครู'); if(!(x.m.s&&x.m.s.done)) miss.push('นักเรียน'); if(!(x.m.p&&x.m.p.done)) miss.push('ผู้ปกครอง'); if(!(x.m.eq&&x.m.eq.done)) miss.push('EQ'); if(miss.length) (by[x.s.cls]=by[x.s.cls]||[]).push(x.s.no+':'+miss.join('/')); });
    const ks=Object.keys(by).sort();
    if(!ks.length) return head+'\nทุกคนประเมินครบแล้ว ขอบคุณทุกท่าน 🙏'+foot;
    return head+'\n⏳ รายการที่ยังไม่ครบ (เลขที่:ผู้ประเมินที่ขาด)\n'+ks.map(k=>'• '+k+' ('+by[k].length+' คน)\n  '+by[k].join(', ')).join('\n')+'\n\nกรุณาดำเนินการให้เสร็จภายในกำหนด'+foot;
  }
  if(LN.type==='link'){
    const base=(BOOT&&BOOT.url)||'(ลิงก์เว็บแอป)', pb=Store.settings.public_open||{};
    const it=[['student','🧒 นักเรียนประเมินตนเอง (SDQ)'],['parent','👪 ผู้ปกครองประเมิน (SDQ)'],['eq','💚 แบบประเมิน EQ']].filter(a=>pb[a[0]]!==false);
    return head+'\nขอเชิญทำแบบประเมินผ่านลิงก์\n'+it.map(a=>a[1]+'\n'+base+(base.indexOf('?')<0?'?':'&')+'p='+a[0]).join('\n\n')+'\n\nวิธีทำ: เปิดลิงก์ → เลือกห้อง → เลือกชื่อ'+(Store.settings.public_verify?' → กรอกวันเกิด (พ.ศ.)':'')+' → ตอบให้ครบทุกข้อแล้วกดส่ง\nกรณีไม่มีมือถือ ขอรับแบบกระดาษได้จากครูที่ปรึกษา'+foot;
  }
  const s=Store.Students[LN.sid]||L[0]; if(!s) return 'ไม่พบนักเรียน';
  const m=summary(s,rd), lvs={n:'อยู่ในเกณฑ์ปกติ',r:'อยู่ในกลุ่มเสี่ยง',p:'อยู่ในกลุ่มที่ควรได้รับการช่วยเหลือ'};
  return 'เรียน ท่านผู้ปกครองของ '+s.name+' ('+s.cls+')\n'+sc.name+' ขอแจ้งผลการประเมินพฤติกรรม (SDQ) '+roundTh(rd)+'\n\n'+(m.worst?'ภาพรวม: '+lvs[m.worst]+(m.dims.length?'\nด้านที่ควรดูแล: '+m.dims.join(', '):''):'ขณะนี้ยังประเมินไม่ครบ')+'\n\nครูที่ปรึกษาจะติดต่อเพื่อร่วมวางแนวทางดูแลนักเรียนต่อไป หากมีข้อสงสัยสามารถติดต่อโรงเรียนได้'+foot;
}
function lineModal(type,o){
  Object.assign(LN,{type:type||'summary',cls:Store.cls||'',sid:'',names:false,extra:'',user:'',issued:null},o||{}); if(LN.type==='acct'&&!isAdmin()) LN.type='summary';
  const cl=classes(), pr=()=>{ $('#ln_pv').textContent=lnText(); $('#ln_n').textContent=$('#ln_pv').textContent.length+' ตัวอักษร'; };
  const m=modal('<div class="row"><h3 style="margin:0">💬 ข้อความแจ้งลง LINE</h3><span class="sp"></span><button class="btn sm" id="ln_x">ปิด</button></div>'
   +'<div class="grid g2" style="margin:12px 0"><label class="f">ประเภทข้อความ<select id="ln_t">'+Object.keys(LN_TYPES).filter(k=>k!=='acct'||isAdmin()).map(k=>'<option value="'+k+'"'+(k===LN.type?' selected':'')+'>'+LN_TYPES[k]+'</option>').join('')+'</select></label>'
   +'<label class="f" id="ln_uw" style="display:none">บัญชีที่ต้องการส่ง<select id="ln_u"><option value="__all">ทุกบัญชี (ครูทุกห้อง + ผู้บริหาร)</option>'+(isAdmin()?lnAcctUsers().map(u=>'<option value="'+esc(u.username)+'">'+esc(u.name+' · '+u.username)+'</option>').join(''):'')+'</select></label>'
   +'<label class="f" id="ln_cw">ชั้น/ห้อง<select id="ln_c"><option value="">ทุกห้อง</option>'+cl.map(c=>'<option'+(c===LN.cls?' selected':'')+'>'+esc(c)+'</option>').join('')+'</select></label>'
   +'<label class="f" id="ln_sw" style="grid-column:1/-1;display:none">นักเรียน<select id="ln_s"></select></label></div>'
   +'<label class="row" id="ln_nw" style="gap:8px;margin-bottom:8px"><input type="checkbox" id="ln_nm" style="width:auto"> แสดงชื่อ-นามสกุลนักเรียน <span class="muted">(ปิดไว้ = แสดงเฉพาะชั้น/เลขที่)</span></label>'
   +'<label class="f">ข้อความเพิ่มเติมท้ายประกาศ (ไม่บังคับ)<input id="ln_e" placeholder="เช่น กำหนดส่งภายในวันศุกร์นี้"></label>'
   +'<div style="margin-top:12px"><b>ตัวอย่างข้อความ</b> <span class="muted" id="ln_n"></span></div>'
   +'<div id="ln_pv" style="white-space:pre-wrap;background:#F4FBF9;border:1px solid var(--soft);border-radius:14px;padding:14px;margin-top:6px;max-height:42vh;overflow:auto;line-height:1.6;font-size:15px"></div>'
   +'<div class="note warn" id="ln_wn" style="margin-top:10px"></div>'
   +'<div class="row" style="margin-top:14px"><span class="sp"></span><button class="btn" id="ln_c2">ยกเลิก</button><button class="btn pri" id="ln_cp">📋 คัดลอกข้อความ</button></div>');
  const fillS=()=>{ const L=lnList(); $('#ln_s').innerHTML=L.map(s=>'<option value="'+esc(s.id)+'"'+(s.id===LN.sid?' selected':'')+'>'+esc(s.cls+' เลขที่ '+(s.no||'-')+' '+s.name)+'</option>').join(''); if(!LN.sid||!Store.Students[LN.sid]||(LN.cls&&Store.Students[LN.sid].cls!==LN.cls)) LN.sid=L[0]?L[0].id:''; $('#ln_s').value=LN.sid; };
  const sync=()=>{ $('#ln_wn').textContent=LN.type==='acct'?'ข้อความมีรหัสผ่าน — แนะนำให้ส่งแยกรายบุคคล (เลือกบัญชีทีละคน) ไม่ส่งรวมในกลุ่มใหญ่':'ข้อมูลผลประเมินเป็นข้อมูลส่วนบุคคลของนักเรียน — ควรส่งในกลุ่มที่เกี่ยวข้องเท่านั้น และหลีกเลี่ยงการแสดงชื่อในกลุ่มใหญ่'; $('#ln_uw').style.display=LN.type==='acct'?'':'none'; if(LN.type==='acct') $('#ln_u').value=(LN.user==='__issued'?'__all':(LN.user||'__all')); $('#ln_sw').style.display=LN.type==='student'?'':'none'; $('#ln_nw').style.display=(LN.type==='care'||LN.type==='student')?(LN.type==='student'?'none':''):'none'; $('#ln_cw').style.display=(LN.type==='link'||LN.type==='acct')?'none':''; if(LN.type==='student') fillS(); pr(); };
  $('#ln_t').onchange=e=>{ LN.type=e.target.value; sync(); };
  $('#ln_c').onchange=e=>{ LN.cls=e.target.value; sync(); };
  $('#ln_s').onchange=e=>{ LN.sid=e.target.value; pr(); };
  $('#ln_u').onchange=e=>{ LN.user=e.target.value; pr(); };
  $('#ln_nm').onchange=e=>{ LN.names=e.target.checked; pr(); };
  $('#ln_e').oninput=e=>{ LN.extra=e.target.value; pr(); };
  $('#ln_x').onclick=$('#ln_c2').onclick=closeModal;
  $('#ln_cp').onclick=()=>copyText($('#ln_pv').textContent);
  sync();
}
async function copyText(t){
  try{ if(navigator.clipboard&&window.isSecureContext){ await navigator.clipboard.writeText(t); return toast('คัดลอกแล้ว — นำไปวางใน LINE ได้เลย'); } }catch(e){}
  const ta=document.createElement('textarea'); ta.value=t; ta.style.cssText='position:fixed;left:-9999px;top:0'; document.body.appendChild(ta); ta.focus(); ta.select();
  let ok=false; try{ ok=document.execCommand('copy'); }catch(e){} ta.remove();
  toast(ok?'คัดลอกแล้ว — นำไปวางใน LINE ได้เลย':'คัดลอกอัตโนมัติไม่ได้ — กดค้างที่ข้อความแล้วเลือกคัดลอก',!ok);
}

/* =====================================================================
   Reveal + เริ่มระบบ
   ===================================================================== */
let _io=null;
function initReveal(){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches){ $$('.reveal').forEach(e=>e.classList.add('in')); return; }
  if(!_io&&'IntersectionObserver' in window) _io=new IntersectionObserver(es=>es.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add('in'); _io.unobserve(en.target); } }),{threshold:.05,rootMargin:'0px 0px -4% 0px'});
  $$('.reveal:not([data-rv])').forEach(e=>{ e.dataset.rv=1; if(_io) _io.observe(e); else e.classList.add('in'); });
}
(async function boot(){
  document.title='ระบบประเมิน SDQ และ EQ '+Store.settings.school_info.name;
  if(BOOT&&BOOT.pub&&PUB_KINDS[BOOT.pub]) return pubView(BOOT.pub);
  const t=ss.get('tok');
  if(t){ Store.token=t; try{ const r=await gasCall('apiResume',t); loadData(r); shell(); enter(); return; }catch(e){ ss.del('tok'); Store.token=''; } }
  loginView(BOOT&&BOOT.m==='t'?'teacher':BOOT&&BOOT.m==='a'?'admin':undefined);   /* ลิงก์ ?m=t / ?m=a เด้งเข้าหน้า login ของโหมดนั้นทันที */
})();
</script>
